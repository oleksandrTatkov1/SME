 William_Tubman:0 "Уильям Табмен"
 LMM_tabmen_desc:0 "Родился в городе Харпер 13 ноября 1895, Республика Либерия. Сын приходского священника и мелкого судейского клерка, Уильям Табмен с юных лет был окружён атмосферой протеста и пафосных речей о морали, порядке и «особом пути Либерии». Окончил скромный миссионерский колледж в Монровии, где отличался фанатичной усидчивостью и стремлением к власти, гораздо большим, чем к знаниям. В молодости мечтал о юридической карьере и быстро вошёл в круги монровийской политической элиты. Его карьера развивалась стремительно: судья, сенатор, министр. Он рано понял главный закон африканской политики: власть принадлежит тому, кто умеет улыбаться в лицо врагу и в тот же вечер подписать его приговор. В 1944 году, после череды заговоров и интриг, Табмен становится президентом. Тогда ему казалось, что он приведёт Либерию в «новую эпоху». Он и впрямь модернизировал страну: открыл шахты, заключил сделки с американскими корпорациями, укрепил армию. Но вместе с дорогами и телефонами в страну пришли коррупция, мафия, диктат силовиков и новая форма рабства для бедноты. Сейчас, в 1965 году, его власть гниёт изнутри. Монровия держится, но за её пределами начинается чужая Либерия — земля, где власть делят армии фанатиков, бандиты и голодные солдаты. Табмен всё ещё собирается выйти на балкон и сказать: «Я контролирую эту страну». Но все знают: старик смертен. А вместе с ним умрёт и старая Либерия."
 LMM_numa:0 "Нюма Джозеф Коли"
 LMM_numa_desc:0 "Маршал Джон Нюма — фигура, о которой не расскажут учебники. Он не давал интервью, не произносил речей, не стремился к славе. О нём редко писали газеты — но знали все. Его шаги в коридоре президентского дворца были знаком, что решения уже приняты. Родился 3 октября 1899 года в прибрежном поселении на юге Либерии, из старой аристократической семьи америко-либерийцев. С ранних лет был отправлен в Британскую Западную Африку, а затем — в офицерское училище при колониальной армии. Воевал в Бирме и Кении, где зарекомендовал себя как дисциплинированный, но холодный и жёсткий командир. Там он и научился главному: не задавать вопросов. В Либерию вернулся в конце 1950-х. Президент Табмен лично назначил его главой Президентской гвардии — личной силы, действующей вне рамок закона. Нюма не строил сеть лояльных людей, не вел кулуарных игр. Он выполнял. Стачка в Боми-Хиллс? Угасла. Депутаты, пропавшие без следа? Доклад подготовлен. Вокруг него ходили слухи — о тюрьмах без окон, о подвалах без дверей, о том, что он никогда не спит. Когда Табмен начал терять контроль над страной, именно Нюме передали полную оперативную свободу в пределах столицы. С этой минуты он больше не был просто тенью. Он стал кулаком. Теперь, когда президент пал, страна смотрит в лицо человеку, который никогда не стремился быть лидером. Но у которого остались солдаты. И список имён."
