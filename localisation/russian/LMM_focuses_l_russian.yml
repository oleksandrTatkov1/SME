### Focus Tree: Tabmen Death
 LMM_last_hour_Tabmen_lion: "Час либерийского Льва"
 LMM_last_hour_Tabmen_lion_desc: "Уильям Табмен. Его называли "отцом нации", "лидером всех африканцев", "великим строителем". Он действительно правил дольше, чем любой мог представить. Пережил заговоры, восстания, революции, даже ухитрился сохранить кресло при новой мировой реальности монгольского порядка. Его улыбка ещё сияет с газетных страниц, его портреты висят на стенах, его голос звучит с дрожащей плёнки в радиопередачах: "Либерия — едина, Либерия — сильна. Но время льва истекает. Пока Монровия держится, режим ещё жив. Но каждый день становится яснее: этот режим умирает не громко, а медленно, с позорной дряхлостью. Вперёд идут только те, кто давно точит ножи на преемников. Всё остальное — пыль, воспоминания и страх."
 LMM_visability_order: "Сохраняя видимость порядка"
 LMM_visability_order_desc: "Митинг за митингом. Обещания за обещаниями. Монровия живёт в вымышленном времени. Радио передаёт бодрые марши, газеты публикуют репортажи о "новых успехах в сельском хозяйстве", министры отчитываются о "процветании народа". На улицах — парады, улыбки чиновников, охрана с автоматами у правительственных зданий. Но это всё лишь декорации. За пределами нескольких кварталов столицы реальность иная: перекрытые дороги, джунгли, в которых хозяйничают банды, деревни, сожжённые мародёрами. Солдаты продают автоматы повстанцам. Губернаторы давно не подчиняются центру. Казна пуста. Эти парады не остановят крах. Но они дают время. Для Табмена важно не упасть в грязь публично, важно уйти красиво… или хотя бы не сейчас."
 LMM_carte_blanche_security_forces: "Дать карт-бланш силовикам"
 LMM_carte_blanche_security_forces_desc: "Табмен бросает остатки чести за борт. С этого дня его силовики могут всё. Власть отдаётся в руки генералов, комендантов, палачей. Никаких судов. Никаких протоколов. Местные власти имеют право устраивать зачистки, казни, конфискации. Тех, кто мешает, объявляют террористами. Офицеры вешают мёртвых бойцов повстанцев на столбах "для устрашения". Но кровь рождает кровь. За каждую деревню, сожжённую армией, рождается новая банда в джунглях. За каждую расправу над мирными жители уходит в лес целая семья. Монровия будет купаться в крови. Но может быть… это и есть единственный способ спасти старый режим от неминуемой смерти."
 LMM_purging_generals_disloyalty: "Очищение генералитета от нелояльных"
 LMM_purging_generals_disloyalty_desc: "Генералы Табмена — не единый кулак. Среди них есть и те, кто мечтает о новом порядке, и те, кто уже торгуется с повстанцами. Некоторые держат связь с коммунистами, другие кормят свои бригады поставками из соседних стран. Если старый лев хочет дожить до заката на своём троне, пора перестать жалетль предателей. Аресты, исчезновения, "несчастные случаи на манёврах" — методы известны. В кабинете министров, в штабе армии, в тюрьмах уже составляют списки. Оставшиеся будут бояться. Или сделают вид, что боятся."
 LMM_guard_of_tabmen: "Укрепить гвардию Табмена"
 LMM_guard_of_tabmen_desc: "Президентская гвардия — последний надёжный оплот режима. Это не армия. Это личная свора Табмена. Их форма глажена, их автоматы начищены, их командиры верны не Либерии, а лично старому льву. Когда столица дрожит от слухов, когда армейские части переходят к повстанцам, когда губернаторы сбегают в джунгли — только эти люди в чёрной форме стоят до конца. Они охраняют банки, аэропорт, министерства. Они защищают самого Табмена от тех, кто ещё вчера называл его "отцом нации". Гвардия получает лучшее оружие, лучшие пайки, особые полномочия. Их называют "псы президента". И пока хозяин жив — эти псы будут рвать глотки."
 LMM_martial_law_in_border_areas: "Военное положение в приграничных районах"
 LMM_martial_law_in_border_areas_desc: "Провинции горят. Повстанцы контролируют лесные дороги, обложили данью деревни, берут в заложники чиновников. В некоторых местах на карты уже не ставят флаг Монровии. В ответ правительство вводит военное положение. Лагеря для "неблагонадёжных", комендантский час, карательные рейды. Шоссе патрулируют броневики. Каждую неделю — расстрел очередной шайки мятежников. Власть возвращается медленно, через кровь. Но возвращается ли она на самом деле — или только на картах, присланных в Монровию?"
 LMM_end_Illusions: "Конец Илюзий"
 LMM_end_Illusions_desc: "На улицах столицы гудят митинги, в провинциях появляются листовки с лозунгами, в университетах шепчутся о переменах. Те, кто ещё вчера верил обещаниям Табмена, сегодня бросают в полицейских камни. Старый лев наблюдает за этим из окна своего дворца и понимает: время иллюзий прошло. Народ требует перемен, но не поверит в них, пока он жив. И теперь перед режимом стоит простой выбор: либо имитировать реформы ради сохранения власти, либо обрушить на улицы всю мощь дубинок, автоматов и пулемётов."
 LMM_promise_reforms: "Обещать реформы"
 LMM_promise_reforms_desc: "На улицах всё чаще звучат слова «перемены» и «будущее». За границей поговаривают, что Либерия стоит на краю катастрофы. Табмен решает сделать ход, знакомый любому старому диктатору: пообещать реформы, которые никто не собирается выполнять. Газеты запестрят заголовками: «Президент готов к диалогу с народом», «Начата работа над новой Конституцией», «Создан комитет примирения». За этими словами нет ничего. Комитеты будут собраны из чиновников и генералов, комиссия напишет отчёт, который ляжет в ящик. Главное сейчас — выиграть время. Главное сейчас — заставить поверить, что перемены ещё возможны… Пока не поздно."
 LMM_congress_nation: "Конгресс Нации"
 LMM_congress_nation_desc: "Режим организует пышный спектакль под названием "Конгресс Нации". В столицу свозят лояльных чиновников, запуганных предпринимателей, коррумпированных вождей деревень и офицеров в медалях. Им выдают заранее написанные речи о единстве, стабильности и «особом пути Либерии». Газеты публикуют их портреты, радио передаёт пафосные лозунги: «Страна едина как никогда!» Все знают цену этим словам. Но для иностранцев картинка работает. Для столицы это выглядит как сила. А за пределами Монровии всё равно правят пули, не речи. Ложь ещё раз продлевает агонию режима."
 LMM_disperse_provocateurs: "Разогнать провокаторов дубинками"
 LMM_disperse_provocateurs_desc: "Толпы митингующих всё чаще собираются в столице. Они выкрикивают лозунги о свободе, о правах человека, требуют «демократии» и «реформ». Табмен больше не намерен их слушать. Улица знает только силу. Армия — не для разговоров, полиция — не для убеждений. Дубинки, водомёты, слезоточивый газ. Провокаторы разогнаны. Газеты пишут о «восстановлении порядка». Вокзалы вновь полны людей в форме. Страх возвращается на улицы Монровии."
 LMM_tough_measures_protest_leaders: "Жёсткие меры против лидеров протестов"
 LMM_tough_measures_protest_leaders_desc: "Разгон толпы оказался лишь началом. За криками на улицах всегда стоят люди: активисты, профсоюзные лидеры, студенческие ораторы, либеральные священники. Теперь настала их очередь. Табмен лично одобряет план по «нейтрализации угроз». Аресты начинаются с рассветом, исчезновения — ночью. Семьи молчат, соседи боятся. Те, кто ещё вчера громко говорил о свободе, сегодня дрожат в камерах или лежат в безымянных могилах у обочин. Суды превращаются в фарс. Газеты публикуют показательные приговоры. Армия улыбается."
 LMM_did_it_work: "А сработало ли это?"
 LMM_did_it_work_desc: "Всё было сделано: Обещаны реформы, подписаны бумаги, проведены съезды чиновников и вождей. Или… улицы залиты кровью, лидеры протестов брошены в тюрьмы, а спецслужбы следят за каждым шёпотом. Табмен смотрит на карту страны, отмеченную булавками: здесь бунтуют, тут шепчут, там молчат от страха. Но главный вопрос остаётся без ответа. Сработало ли это?"
 LMM_roaring_louder: "Рычать громче"
 LMM_roaring_louder_desc: "В Монровии вновь тихо. На улицах нет больше митингов, лишь солдаты в форме и плакаты о стабильности. Газеты хором пишут: «Порядок восстановлен!», «Правительство под контролем!» Министры рапортуют: экономика стабилизирована, безопасность усилена, границы надёжны. Кажется, Табмену удалось невозможное: удержать власть, заглушить голоса недовольства, подавить хаос. Всё кажется спокойным. И всё же… в глубине души каждый понимает: это не мир, это пауза перед грозой. Но старый лев всё равно готовится выступить с речью. Последней речью."
 
 ### Focus Tree: The Fall of Liberia
 LMM_fall_of_the_lion: "Падение Льва"
 LMM_fall_of_the_lion_desc: "Уильям Табмен пал прямо во время речи. Никто не решился подойти — все взгляды обратились к человеку, стоящему в тени сцены: Джону Нюме. Без лишних слов он взял на себя управление. Без выборов, без одобрения партии, без речи. Либерия осталась без своего Льва — и вместо него теперь марширует Слон. Монровия молчит, опасаясь сделать неверный шаг. За пределами столицы начинается брожение, но гвардия готова. Республика дрожит. Впереди — неизвестность."
 LMM_state_of_emergency: "Давление Слона"
 LMM_state_of_emergency_desc: "Маршал Коли подписал указы, отменяющие действие конституции на всей территории страны. Правительство ввело комендантский час, ограничил свободу прессы и передвижения, окружил парламент. На улицах — бронетехника. В кабинетах — пустые кресла."
 LMM_cleansing_the_cities: "Зачистка городов"
 LMM_cleansing_the_cities_desc: "Солдаты с собаками прочёсывают районы. Подозреваемых нет — есть только приказы. Гвардия Нюмы 'прочищает' улицы от бунтарей, студентов, журналистов. Грохот сапог и лязг дубинок заменили диалог."
 LMM_abandoned_by_elites: "Крысы бегут с тонущего корабля"
 LMM_abandoned_by_elites_desc: "Министры бегут, дипломаты молчат, инвесторы выводят деньги. Остались только гвардейцы, бетонные блоки и дым. Либерия начинает разваливаться сверху вниз — без мозгов, без сердца, с одними кулаками."
 LMM_ligniting_the_jungle: "Огни в дужнглях"
 LMM_ligniting_the_jungle_desc: "Глубинка восстаёт. В лесах вспыхивают мятежи, племенные вожди берут в руки старое оружие. Ответ — напалм и расстрелы. Либерия горит — и не только от протестов, но и от мести."
 LMM_elephant_on_rollers: "Слон на роликах"
 LMM_elephant_on_rollers_desc: "Нюма — это слон, поставленный на ролики и пущенный в стеклянную лавку. Он тяжёл, неуклюж, и неудержим. Порядок сменяется паранойей, а управление — хаосом. Мы катимся к развалу, и никто уже не сможет остановить движение."