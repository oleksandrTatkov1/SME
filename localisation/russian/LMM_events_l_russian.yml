LMM_tabmen_tree_event.1.t: "Последний час старого льва"
LMM_tabmen_tree_event.1.d: "Уильям Табмен остаётся в своём дворце, словно в мавзолее живого правителя. Кабинеты вокруг пустеют, министры смотрят друг на друга с подозрением, губернаторы тянутся к собственным армиям и собственным амбициям. Вокруг столицы ещё держится фасад порядка, но всё чаще из провинций приходят странные вести: исчезающие части, саботаж на дорогах, тайные собрания военных. Табмен молчит. Он готовит свою последнюю речь. Готовит свои последние указы. Но даже его силовики смотрят теперь мимо, не в глаза, а в будущее, где старого льва уже не будет."
LMM_tabmen_tree_event.1.a: "Пора за роботу!"
LMM_tabmen_tree_event.2.t: "Среди нас был человек в белом костюме"
LMM_tabmen_tree_event.2.d: "Площадь казалась живой. Люди пришли с плакатами, с криками, с яростью. Кто-то требовал немедленного падения режима, кто-то — просто хлеба, кто-то — честных выборов. И вдруг среди толпы появился человек в светлом костюме, в белой рубашке, без охраны. Его знали почти все. Вице-президент Уильям Ричард Толберт. Он не обещал казней. Он говорил о мире, о единстве, о правах. «Либерия должна выйти из этой тьмы не через кровь, а через диалог. Через выборы. Через новые законы. Я говорю это от имени всех, кто устал от страха.» Толпа слушала, но аплодисменты были слабыми. Слишком многие уже не верили словам. Слишком многие знали: в соседнем квартале полиция точит дубинки. Но всё равно… кто-то впервые за долгое время подумал: "Может, ещё не всё потеряно?""
LMM_tabmen_tree_event.2.a: "Надежда еще есть!"
LMM_tabmen_tree_event.3.t: "Пусть они говорят друг другу, что всё хорошо"
LMM_tabmen_tree_event.3.d: "В этот день Монровия вновь надела маску стабильности. В зале собрались те, кто согласен быть частью спектакля. Громкие речи о примирении, заверения в верности правопорядку, слова о будущем без мятежей. Газеты напишут, что «нация сплотилась». Радио передаст всё это в эфир. Уильяма Ричарда Толберта туда не пригласили. Или пригласили формально — зная, что он не придёт. Его кабинет остался тихим, его телефон сегодня молчит подозрительно долго. Толберт смотрит в окно. Там, на улицах, другой Конгресс. Люди, которые не читают заранее одобренные речи. Люди, которых не слушают в этих залах. Он знает: никто в этом городе больше не контролирует происходящее. Даже старый лев в президентском кресле лишь оттягивает конец. Пусть этот Конгресс говорит сам с собой. Ответ улиц прозвучит куда громче. А может быть, уже слишком поздно говорить вообще."
LMM_tabmen_tree_event.3.a: "Я знаю, что это не остановит бурю..."
LMM_tabmen_tree_event.4.t: "Взгляд сквозь стекло"
LMM_tabmen_tree_event.4.d: "Пыльный воздух старой Монровии вибрировал от шагов. Протестующие заполнили центральные аллеи — те самые, где ещё недавно маршировали кадеты, а теперь шагали простые люди: молодёжь, рабочие, чиновники без должностей. Над головами развевались плакаты, но слова тонули в гуле. Где-то ближе к зданию старого Национального архива, за витриной заколоченного книжного магазина, его заметили. Уильям Ричард Толберт-младший стоял среди людей. Без микрофона, без охраны. В его глазах — тревога, и вместе с тем — решимость. Он не кричал. Просто был рядом. Колонна жандармерии начала наступление. Первые удары резиновых дубинок, клубы газа — и всё всколыхнулось. Кто-то закричал: — Он тут! Толберт! Вой сирен перекрыл всё. Один из офицеров колебался. Другой выдохнул сквозь зубы: — Приказ есть приказ. На секунду Толберт оказался перед разбитой витриной. Он обернулся. Через треснувшее стекло его взгляд пересёкся с глазами солдата. Тот замер, но только на миг."
LMM_tabmen_tree_event.4.a: "История запоминает тех, кто не отвёл взгляда."
LMM_tabmen_tree_event.5.t: "Охота на символ"
LMM_tabmen_tree_event.5.d: "Первые списки были короткими: организаторы, радикалы, студенческие лидеры. Потом в графах начали появляться новые имена — менее активные, но более значимые. Сегодня в столице расползся слух, будто «Либерийский лев» приказал схватить Уильяма Толберта. Не для суда — для устрашения. Он был на митингах, но не кричал. Не разжигал, но слушал. Его молчание стало громче лозунгов. Он не уклонялся — просто шагал с народом. Ночью силы госбезопасности попытались войти в дом его кузена, где он, по информации информатора, якобы скрывался. Но было поздно: окно спальни было открыто, чай на столе остывал, а вместо человека осталась лишь записка. "Я был там, где народ. И буду там снова." Люди шепчут, что он ушёл в подполье. Или, быть может, в следующий раз появится не как свидетель, а как лидер. Страх пошёл по кругу. Власть ищет. А народ ждёт."
LMM_tabmen_tree_event.5.a: "И снова не пойман."
LMM_tabmen_tree_event.6.t: "Доверие Льва"
LMM_tabmen_tree_event.6.d: "Он всегда держался в тени. Ни интервью, ни речей, ни публичных выступлений. Его знали по звуку шагов в коридоре дворца — тяжёлых, отмеренных, как удары метронома. Полковник Джон Нюма, глава Президентской гвардии, бывший офицер британской колониальной армии, прошедший службу в Бирме и Кении, вернулся в Либерию в конце 50-х. Табмен нашёл в нём человека, который не задаёт вопросов. Только приказы — и отчёты. Слухи о его жестокости передавались шёпотом — в Боми-Хиллс, где гвардия «успокаивала» стачку шахтёров, исчезали целые семьи. Но именно он остался рядом, когда в президентский дворец перестали приходить депутаты. Сегодня ночью, по приказу самого Табмена, ему передана полная оперативная свобода в пределах Либерии. Никаких согласований, никакой прессы, никаких ограничений. Только подпись Льва на листе бумаги. Нюма не улыбнулся. Он просто посмотрел в окно — туда, где пылали покрышки и гремели голоса — и молча кивнул. Он знал, что делать. И он не остановится."
LMM_tabmen_tree_event.6.a: "Клетка Льва вновь открыта..."
LMM_tabmen_tree_event.7.t: "Тишина в казармах"
LMM_tabmen_tree_event.7.d: "Они исчезали поодиночке. Кто-то уехал "на совещание" и не вернулся. Кого-то вызывали к начальнику Генштаба — и вскоре менялся комендант. Список подозреваемых в нелояльности теперь больше не обсуждается — он просто существует. Без права обжалования. Полковник Бонифейс Кпана был найден мёртвым у подножия моста Фармингтон. Официальная версия — несчастный случай. Полковник Джон Ньюма лично зачитал "обращение к армии", в котором подчеркнул: "дисциплина и верность избранному лидеру — не предмет для интерпретаций." Президент Табмен подписывает указы об отставке сразу трёх генералов, заменяя их молодыми и лояльными офицерами. Некоторые из них — его бывшие телохранители."
LMM_tabmen_tree_event.7.a: "Верность — это не обсуждается."
LMM_tabmen_tree_event.8.t: "В лесах не прячутся призраки"
LMM_tabmen_tree_event.8.d: "На севере страны, в заросших тропиками регионах около Лофы и Нимбы, коммунистические боевики устроили настоящую сеть убежищ. Снабжаемые через сельские каналы, они распространяли листовки, устраивали налёты на колонны и поднимали местное население на сопротивление. Но гвардия Табмена пришла и сюда. Высадка с вертолётов, жёсткие рейды по деревням, оперативная работа с доносами и контроль над дорогами — операцию курировал лично Нюма Коли, переместив командный пункт на окраину зоны боевых действий. Боевики, привыкшие к медлительности армии и разброду в полиции, не ожидали такой точности и скорости. Укрытия сожжены, несколько командиров пленены, десятки боевиков — мертвы. В докладе командования говорится кратко: «Очаг подавлен. Результаты удовлетворительные. Подозрительные элементы — выведены из среды.»"
LMM_tabmen_tree_event.8.a: "Тише лес — спокойнее столица"
LMM_tabmen_tree_event.9.t: "Исчезнувшие в зелени"
LMM_tabmen_tree_event.9.d: "Сержант Джозеф Броу сидел у костра, проверяя снаряжение и прислушиваясь к джунглям. Пост №9 на границе с лесами Бонг и Лофы был враждебным местом — влажность, москиты, и... что-то ещё. В ту ночь не было выстрелов, не было голосов в рации. Лишь шорох листвы, иногда — стук чего-то деревянного, будто палки били в землю. Один из рядовых сказал, что слышал, как женский голос пел за деревьями, но никого не увидели. Утром двое солдат не вернулись со смены патруля. Следов не было. Только перевёрнутая каска у ручья и странные символы, вырезанные на коре дерева. Когда об этом сообщили командованию, пришёл приказ: укрепить блокпост, не покидать периметр ночью и не вступать в контакт с неизвестными местными — особенно если те молчат.Сержант больше не спит. Он говорит, что джунгли глядят в ответ."
LMM_tabmen_tree_event.9.a: "Это ЕГО владение..."
LMM_tabmen_tree_event.10.t: "Лев, что заревел…"
LMM_tabmen_tree_event.10.d: "Митинг у зданий Национальной ассамблеи в Монровии собрал тысячи — партийных чиновников, офицеров, студентов и крестьян, привезённых автобусами. На фоне алых флагов и транспарантов президент Уильям Табмен, величественный, как всегда, поднялся на трибуну. Он начал говорить: — «Мы — Лев Африки. Нас хотят заглушить — но наш рык станет громче!» Он вытянул руку к толпе, словно пророк, замер — и вдруг осел. Толпа ахнула. Секунду спустя охранники ринулись к нему, кто-то крикнул: — «Сердце! У него сердце!» Табмена унесли, не давая журналистам подойти. На трибуне осталась только его шляпа. Через полчаса из дверей вышел Нюма Джозеф Коли — глава президентской гвардии, мрачный и твёрдый. Он не стал произносить речь. Лишь бросил в толпу коротко: — «Порядок будет сохранён. Все решения — в руках Государственного Совета до прояснения состояния Президента.»"
LMM_tabmen_tree_event.10.a: "Рык оборвался..."

LMM_liberia_fall.1.t: "Лев пал. Но слон всё ещё стоит"
LMM_liberia_fall.1.d: "Маршал Нюма Коли, председателю: — Он больше не сможет. Вы все это видели. Президент Табмен лежит, бледный как смерть, и не узнаёт даже свою жену. Врач сказал — инсульт. Кто подписывает указы? Кто координирует министерства? Я, чёрт побери! Я был его щитом двадцать лет. Я глотал всё — эти напыщенные речи, их постоянные интриги, тонкие намёки, что я «не из них». Но сейчас — время не слов, а решений. И я принимаю их. Завтра утром будет объявлено чрезвычайное положение. Генеральный штаб уже приведён в готовность. Никто не уйдёт. Никто не пересечёт границу. Мне плевать, как это назовут. Госпереворот? Пусть. Лев пал. Но слон всё ещё стоит. И он будет идти. По их улицам, по их роскоши, по их страхам. Пока в этой стране не останется ни одного предателя. (тишина в зале) — Заседание окончено. С этого момента я действую без согласования."
LMM_liberia_fall.1.a: "Пришло время маршала."
LMM_liberia_fall.2.t: "Слон остался один"
LMM_liberia_fall.2.d: "Я покидаю Либерию. Говорят, это трусость. Пусть будет так. У маршала Нюмы уже давно не осталось ни совести, ни сомнений — только паранойя и сила. Он выгнал Верховного судью. Он арестовал троих сенаторов. Он лично угрожал мне на совещании Кабмина. А теперь по всей стране вспыхивают “джунглевые восстания”. Это не просто бандитизм. Это уже война. Последний корабль — старый бельгийский грузовоз, “Антверпенская звезда”. На борту — журналисты, два генерала, моя семья и я. Я слышал, что в Бонг-Майн уже слышны автоматные очереди. В стране не осталось городов, в которых не стреляют. Я служил при Табмене. Я видел, как этот строй держался на компромиссах. У Нюмы нет такого чувства меры. Он — слон. Но на роликах. Всё крушит, даже не замечая. Прощай, моя страна. Я больше ничем не могу помочь..."
LMM_liberia_fall.2.a: "Они бегут от бури..."
LMM_liberia_fall.3.t: "Огни в джунглях"
LMM_liberia_fall.3.d: "Секретный доклад для Верховного коменданта Монровии От: Главного оперативного штаба Президентской гвардии Кому: Маршалу Нюме Джозефу Коли Статус: Конфиденциально Маршал,в последние 48 часов зафиксированы множественные боестолкновения между подразделениями правительственных сил и вооружёнными элементами, действующими в лесных зонах округов Бонг, Лофа и Гранд-Геде. По оперативной информации, против нас выступают не только коммунистически настроенные повстанцы и племенные ополченцы, но и ранее неизвестные сектантские формирования. Несколько захваченных деревень находятся под контролем фанатичных групп, члены которых утверждают, что «Лев пал, и наступила Чёрная Заря». На деревьях развешаны символы неизвестного происхождения, а местные жители сообщают о ночных обрядах с человеческими жертвоприношениями. Разведка зафиксировала появление вооружённых фанатиков в самодельных масках, сопровождаемых «пророками», говорящими от имени «духа джунглей». Согласно перехваченным записям, эти культисты считают хаос "очищающим огнём" и стремятся ускорить распад Либерии. Два броневика правительственных сил подбиты самодельными взрывными устройствами, семь солдат пропали без вести. Поставки снабжения в восточные районы фактически прерваны. В регионе царит страх, а центр теряет влияние. Ситуация нестабильна. Необходимо немедленно задействовать все доступные резервы, включая внутреннюю охрану столицы. Мы стоим не просто перед мятежом — мы стоим перед лицом распада реальности. С уважением,Майор Тибо Н'Гала Начальник оперативного отдела"
LMM_liberia_fall.3.a: "Джунгли просыпаются!"
LMM_liberia_fall.4.t: "Слон на роликах"
LMM_liberia_fall.4.d: "Закрытое заседание Совета национальной безопасности. Маршал Нюма сидит в кресле, обтянутом красным бархатом, обложенный папками, сводками и пустыми бутылками. Генералы стоят, как призраки, никто не решается начать. Первый говорит министр связи, голос дрожит: — Внутренние провинции полностью отрезаны. Пайнсвілль пал. У нас осталась только Монровия… и, возможно, порт. Нюма поднимает глаза, налитые кровью. — Значит, мы крепость. Пусть пишут: Монровия — последняя твердыня порядка. Никто не аплодирует. Вдали звучат автоматные очереди. Под окнами дворца начинают появляться надписи краской: "Кровь за Табмена", "Нюма — диктатор", "Цирк закрыт". Все знают: это — начало конца. Но сам маршал ещё верит, что сможет управлять, пусть и стоя на роликах, катясь к пропасти."
LMM_liberia_fall.4.a: "Падение не остановить..."
LMM_liberia_fall.5.t: "Красная угроза"
LMM_liberia_fall.5.d: "Сегодня в штаб-квартиру правительства поступили тревожные донесения: группа вооружённых марксистских повстанцев, ранее действовавших преимущественно подпольно, взяла под контроль несколько ключевых населённых пунктов на севере страны. Под их контролем оказался административный центр провинции Лофа — Войнжама. Сообщается о поднятии красного флага над местным управлением и резком росте числа дезертиров из состава армии, ранее расквартированной в регионе. Повстанцы распространяют заявления о начале народной революции и обвиняют режим Монровии в «тотальной узурпации воли трудящихся». Министерство обороны называет ситуацию «тактическим отступлением», однако за закрытыми дверями всё больше генералов признают: правительство утратило контроль над севером. Попытки переброски подкреплений блокируются партизанскими отрядами, а дороги усеяны баррикадами и сожжённой техникой. Коммунистическая угроза перестала быть тенью. Она обрела землю, оружие и последователей."
LMM_liberia_fall.5.a: "За революцию!"
LMM_liberia_fall.5.b: "Они сделали свой ход. Остались и другие."
