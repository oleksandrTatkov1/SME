l_russian:
 LMM_ghost_government: "Призрачное правительство Либерии"
 LMM_ghost_government_desc: "Монровия — последний оплот старого порядка. За её окраинами начинается другая Либерия: пылающие деревни, дороги, перекрытые колючей проволокой, и бесконечные джунгли, где правят не законы, а мачете. Коммунисты вешают чиновников на телефонных столбах. Фанатики «Детей Змея» разносят по радио проповеди о конце света. А в тени — анонимные «генералы» ведут свои армии бандитов, продавая лояльность тому, кто заплатит. Правительство ещё держится… но каждый знает — это лишь вопрос времени."
 LMM_last_time_of_liberia_lion: "Последний час старого льва"
 LMM_last_time_of_liberia_lion_desc: "Табмен правил десятилетиями. Пережил заговоры, войны и даже монгольских эмиссаров. Но теперь все понимают — старик смертен. Его руки дрожат. Его приказы всё чаще игнорируют. В кабинетах Монровии уже делят портфели, а в джунглях повстанцы шепчут, что «скорó придет новый день». Режим ещё держится… но это уже не правление. Это агония."
 LMM_people_angry: "Народные демонстрации"
 LMM_people_angry_dp: "Подавленные демонстрации"
 LMM_tabmen_guard: "Президентская Гвардия"
 LMM_border: "Военное присутствие в округах"
 LMM_border_desc: "В условиях нарастающего внутреннего напряжения правительство распространило полномочия сил безопасности далеко за пределы столичной зоны. Военные патрули теперь дежурят на площадях провинциальных городов, контрольно-пропускные пункты появились на въездах в сёла, а офицеры ссылаются на “угрозу национальной целостности” при каждом задержании. Мирные округа превращаются в зоны наблюдения, где слово солдата весит больше, чем закон."
 LMM_elephant_in_the_china_shop: "Слон в посудной лавке"
 LMM_elephant_in_the_china_shop_desc: "Джон Нюма правит не словами, а страхом. Его гвардия шагает по улицам с выключенной эмпатией, как слон в лавке иллюзий о республике. Парламент молчит, суды заперты, пресса исчезла. Каждый приказ — гром, каждое решение — обвал. Нюма держит страну в кулаке. Но всё вокруг — трещит по швам."
 LMM_border_on_fire: "Горящая граница"
 LMM_border_on_fire_desc: "Боевые действия, спровоцированные вторжением в джунгли и разгоном повстанческих гнёзд, вышли из-под контроля. По всей границе Либерии вспыхивают конфликты: коммунистические отряды, сепаратисты, и даже фанатичные культисты стремятся воспользоваться моментом. Дороги блокированы, гарнизоны осаждены, а сёла охвачены паникой. Правительство теряет контроль, и северная граница теперь больше напоминает фронт гражданской войны."